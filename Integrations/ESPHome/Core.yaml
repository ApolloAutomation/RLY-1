substitutions:
  name: apollo-rly-1
  version: "26.11.16.1"
  device_description: ${name} made by Apollo Automation - version ${version}.

  # Bluetooth Proxy switch state on a device with no stored preference yet
  # (first boot after this switch was added, or after a factory reset).
  # RLY-1_BLE.yaml overrides this to ON so devices that always proxied keep
  # proxying instead of going quiet after an update.
  bluetooth_proxy_restore_mode: RESTORE_DEFAULT_OFF

esphome:
  # List form so package merging concatenates with each variant's own on_boot
  # entries (mapping form would be replaced by the variant's block instead).
  on_boot:
    - priority: -100
      then:
        - text_sensor.template.publish:
            id: apollo_firmware_version
            state: "${version}"
    # Re-apply the Bluetooth Proxy switch after all components set up, so BLE
    # scanning matches the switch state restored from flash.
    - priority: -300
      then:
        - if:
            condition:
              switch.is_on: bluetooth_proxy_switch
            then:
              - esp32_ble_tracker.start_scan:
                  continuous: true
            else:
              - esp32_ble_tracker.stop_scan:

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  #flash_size: 8MB
  framework:
    type: esp-idf
    # Drops assert strings so the Bluetooth proxy + managed-update image fits
    # the default 4 MB app partition (same settings as PLT-1 / TEMP-1).
    advanced:
      assertion_level: SILENT
      enable_lwip_assert: false

# Time component required for total_daily_energy
time:
  - platform: homeassistant
    id: homeassistant_time
  - platform: sntp
    id: sntp_time
    timezone: America/New_York
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - logger.log: "Time synchronized with NTP server"
esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    continuous: true

bluetooth_proxy:

api:
  encryption:

globals:
  # Voltage setting for power calculations - can be adjusted for different regions
  - id: line_voltage
    type: float
    restore_value: yes
    initial_value: '120.0'

  - id: cycleCounter
    type: int
    restore_value: no
    initial_value: '0'
  - id: button_press_timestamp
    restore_value: no
    type: uint32_t
    initial_value: '0'
  - id: runTest
    restore_value: yes
    type: bool
    initial_value: "true"
  - id: testCycleCount
    type: int
    restore_value: no
    initial_value: "0"

captive_portal:

web_server:
  port: 80
  # No firmware upload from the device page; the setup hotspot still allows it
  ota: false

one_wire:
  - platform: gpio
    pin: GPIO15

switch:
  - platform: gpio
    name: "Relay"
    pin: GPIO14
    id: relay
  - platform: factory_reset
    id: factory_reset_switch
    internal: true
    
  - platform: template
    name: "Limit Protection"
    id: limit_protection
    icon: mdi:shield
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: "config"
    turn_on_action:
      - logger.log: "Limit protection enabled"
    turn_off_action:
      - logger.log: "Limit protection disabled"

  - platform: template
    name: "Bluetooth Proxy"
    id: bluetooth_proxy_switch
    icon: mdi:bluetooth
    entity_category: "config"
    restore_mode: ${bluetooth_proxy_restore_mode}
    optimistic: true
    on_turn_on:
      - esp32_ble_tracker.start_scan:
          continuous: true
    on_turn_off:
      - esp32_ble_tracker.stop_scan:

text_sensor:
  - platform: template
    name: "Apollo Firmware Version"
    id: apollo_firmware_version
    update_interval: never
    entity_category: "diagnostic"

sensor:
  - platform: dallas_temp
    name: "Temperature Probe"
    update_interval: 5s
    id: temp_probe
  - platform: adc
    pin: GPIO2
    name: "Raw ADC"
    update_interval: 1s
    attenuation: 12db
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 10
      - median:
          window_size: 7
          send_every: 5
      - exponential_moving_average:
          alpha: 0.1
          send_every: 1

binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected
  - platform: gpio
    name: Limit Triggered
    id: limit_triggered
    icon: mdi:connection
    pin: 
      number: GPIO5
      mode:
        input: true
        pulldown: True
    filters:
      - invert:
    on_state:
      then:
        - if:
            condition:
              and:
                - binary_sensor.is_on: limit_triggered
                - switch.is_on: limit_protection
            then:
              - switch.turn_off: relay
              - logger.log: "Limit triggered - turning off relay"
  
    
  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
    id: reset_button
    on_press:
      then:
        - lambda: |-
            id(button_press_timestamp) = millis();    
    on_release:
      then:
        - if:
            condition:
              lambda: "return millis() - id(button_press_timestamp) >= 10000;"
            then:
              # Remove Wifi
              - lambda: "id(runTest) = true;"
              - switch.turn_on: factory_reset_switch
            else:
              # Mains powered: no Prevent Sleep, so a 3-10 s hold does nothing
              - if:
                  condition:
                    lambda: "return millis() - id(button_press_timestamp) < 3000;"
                  then:
                    - script.execute: statusCheck
                    - script.wait: statusCheck
                    # Non-blocking, so the main loop keeps running and the
                    # status colour stays visible before the test turns it green
                    - delay: 3s
                    - lambda: |-
                        id(testCycleCount) = 0;
                        id(runTest) = true;
                    - script.execute: testScript

light:
  - platform: esp32_rmt_led_strip
    id: rgb_light
    name: "RGB Light"
    pin: GPIO3
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 1
    channel_colors: GRB
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 1000ms
          update_interval: 1000ms
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"
    

script:
  - id: statusCheck
    then:
      - if:
          condition:
            - lambda: 'return id(ink_ha_connected).state;'
          then:
            - logger.log: "Apollo Automation: Connected To HA"
            - light.turn_on: 
                id: rgb_light
                brightness: 100%
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  - wifi.connected
                then:
                  - logger.log: "Apollo Automation: Connected To Wifi"
                  - light.turn_on: 
                      id: rgb_light
                      brightness: 100%
                      red: 0%
                      green: 100%
                      blue: 0%
                else: 
                  - logger.log: "Apollo Automation: Not Connected To Wifi"
                  - light.turn_on: 
                      id: rgb_light
                      brightness: 100%
                      red: 100%
                      green: 100%
                      blue: 100%  

  - id: testScript
    then:
      if: 
        condition:
          - lambda: "return id(runTest) == true;"
        then:
          - lambda: "id(runTest) = false;"
          - light.turn_on:
              id: rgb_light
              red: 0%
              green: 100%
              blue: 0%
          - delay: 5s
          - light.turn_on:
              id: rgb_light
              red: 0%
              green: 0%
              blue: 0%
          - light.turn_off:
              id: rgb_light
              
  