substitutions:
  # This variant always proxied; keep the proxy on for devices with no stored
  # Bluetooth Proxy switch state so updating doesn't silently drop it.
  bluetooth_proxy_restore_mode: RESTORE_DEFAULT_ON

esphome:
  name: "${name}"
  friendly_name: Apollo RLY-1
  comment: Apollo RLY-1
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio

  project:
    name: "ApolloAutomation.RLY-1_BLE"
    version: "${version}"

  # Fleet minimum: improv_ble (renamed from esp32_improv) needs 2026.10
  min_version: 2026.10.0

dashboard_import:
  package_import_url: github://ApolloAutomation/RLY-1/Integrations/ESPHome/RLY-1_BLE.yaml
  import_full_config: false

ota:
  - platform: esphome
    id: ota_esphome

http_request:
  verify_ssl: true
  # GitHub release-asset downloads answer with a redirect carrying a
  # ~3.6 KB Content-Security-Policy header; each header line must fit
  # this buffer or the request fails with "HTTP_CLIENT: Out of buffer".
  buffer_size_rx: 5120
  # The redirect target is a signed URL with a ~850-char query string; the
  # follow-up request line must fit the TX buffer or esp_http_client_open
  # fails with "Out of buffer" before sending anything.
  buffer_size_tx: 2048

safe_mode:

bluetooth_proxy:
  active: true
esp32_ble_tracker:
  scan_parameters:
    active: false

wifi:
  # Keeps today's no-reboot on lost Wi-Fi; 2026.11 drops the AP exemption
  reboot_timeout: 0s
  ap:
    ssid: "Apollo RLY1 Hotspot"

logger:

packages:
  core: !include Core.yaml
